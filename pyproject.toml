[project]
name = "flexiznam"
authors = [{name = "Znamenskiy lab", email= "antonin.blot@crick.ac.uk"}]
description = "Tools for processing in situ sequencing data"
readme = "README.md"
requires-python = ">=3.9.0"
dynamic = ["version"]
dependencies = [
            "Click",
        "pandas",
        "portalocker",
        "webbot",
        "pyyaml",
        "flexilims @ git+ssh://git@github.com/znamlab/flexilims.git#egg=flexilims",
        "pymcms @ git+ssh://git@github.com/znamlab/pymcms.git#egg=pymcms",
        "tifffile",
        "ttkwidgets",]
license = {text = "MIT"}

[project.scripts]
flexiznam = "flexiznam.cli:cli"

[project.urls]
"Homepage" = "https://github.com/znamlab/flexiznam"
"Bug Tracker" = "https://github.com/znamlab/flexiznam/issues"
"Documentation" = "https://znamlab.github.io/flexiznam"

"Source Code" = "https://github.com/znamlab/flexiznam"
"User Support" = "https://github.com/znamlab/flexiznam/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "tox",
  "black",
  "mypy",
  "pre-commit",
  "ruff",
  "setuptools_scm",
  "imageio",
]
[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flexiznam*"]
exclude = ["tests", "docs*"]


[tool.pytest.ini_options]
addopts = "--cov=flexiznam"

[tool.black]
target-version = ['py39', 'py310', 'py311']
skip-string-normalization = false
line-length = 88

[tool.setuptools_scm]

[tool.check-manifest]
ignore = [
  ".yaml",
  "tox.ini",
  "tests/",
  "tests/test_unit/",
  "tests/test_integration/",
  "docs/",
  "docs/source/",
]


[tool.ruff]
line-length = 88
exclude = ["__init__.py","build",".eggs"]
lint.select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  # You can see what all the rules do here: https://docs.astral.sh/ruff/rules/
  # Some additional ruff rules that might be useful (uncomment to enable)
  #"UP",  # pyupgrade
  #"B",   # flake8 bugbear
  #"SIM", # flake8 simplify
  #"C90", # McCabe complexity
]
fix = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{39,310,311}
isolated_build = True

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
extras =
    dev
commands =
    pytest -v --color=yes --cov=flexiznam --cov-report=xml
"""
