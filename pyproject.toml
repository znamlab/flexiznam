[project]
name = "flexiznam"
authors = [{name = "Znamenskiy lab", email = "antonin.blot@crick.ac.uk"}]
description = "Handle Znamenskiy lab database"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "Click",
    "flexilims>=1.4",
    "numpy",
    "pandas",
    "portalocker",
    "pymcms>=0.3",
    "pyyaml",
    "requests",
    "tifffile",
    "ttkwidgets",
    "webbot",
]
license = {text = "MIT"}

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
flexiznam = "flexiznam.cli:cli"

[project.urls]
"Homepage" = "https://github.com/znamlab/flexiznam"
"Bug Tracker" = "https://github.com/znamlab/flexiznam/issues"
"Documentation" = "https://znamlab.github.io/flexiznam"

"Source Code" = "https://github.com/znamlab/flexiznam"
"User Support" = "https://github.com/znamlab/flexiznam/issues"

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flexiznam*"]
exclude = ["tests", "docs*"]

[tool.uv.sources]
flexilims = { index = "gitlab-public" }
pymcms = { index = "gitlab-public" }

[[tool.uv.index]]
name = "gitlab-public"
url = "https://gitlab.com/api/v4/projects/85414935/packages/pypi/simple"
explicit = true


[tool.pytest.ini_options]
addopts = "--cov=flexiznam"
markers = [
    "integration: requires external credentials, services, or lab data",
    "slow: requires a graphical browser or substantial processing time",
]

[tool.coverage.run]
source = ["flexiznam"]

[tool.setuptools_scm]

[tool.check-manifest]
ignore = [
  ".yaml",
  "tox.ini",
  "tests/",
  "tests/test_unit/",
  "tests/test_integration/",
  "docs/",
  "docs/source/",
]


[tool.ruff]
line-length = 88
exclude = ["__init__.py", "build", ".eggs"]
lint.select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # isort
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
exclude = ["tests/"]

[dependency-groups]
dev = [
    "imageio",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
